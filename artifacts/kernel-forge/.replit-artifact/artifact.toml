kind = "web"
previewPath = "/"
title = "Kernel Forge"
version = "1.0.0"
id = "artifacts/kernel-forge"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24540

[services.development]
run = "pnpm --filter @workspace/kernel-forge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kernel-forge", "run", "build" ]
serve = "static"
publicDir = "artifacts/kernel-forge/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24540"
BASE_PATH = "/"
